name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include passwords, keys or personal data.
        Security problems: do not use this form, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Screenshots or a short video help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Program version
      placeholder: "for example 1.2.0"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "for example Windows 11 24H2"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
